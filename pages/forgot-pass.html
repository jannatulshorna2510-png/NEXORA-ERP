<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="NEXORA ERP Forgot Password">

    <title>NEXORA ERP | Forgot Password</title>

    <link rel="stylesheet" href="../css/style.css">

    <link rel="stylesheet" href="../css/responsive.css">

</head>


<body>

    <main>


        <!-- Company Information -->

        <section>

            <h1>NEXORA</h1>

            <p>Smart Business Management</p>

        </section>



        <!-- Forgot Password -->

        <section>

            <h2>Forgot Password?</h2>

            <p>
                Enter your email to reset your password
            </p>


            <form id="forgotPasswordForm">


                <!-- Email -->

                <div>

                    <label for="forgotEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="forgotEmail"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>



                <!-- Submit -->

                <button type="submit">
                    Continue
                </button>



                <!-- Back to Login -->

                <p>

                    Remember your password?

                    <a href="login.html">
                        Back to Login
                    </a>

                </p>


            </form>

        </section>

    </main>


    <script src="../js/main.js"></script>

</body>

</html>
