<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="NEXORA ERP Sign Up - Create your business management account">

    <title>NEXORA ERP | Sign Up</title>

    <!-- Main CSS -->
    <link rel="stylesheet" href="../css/style.css">

    <!-- Responsive CSS -->
    <link rel="stylesheet" href="../css/responsive.css">

</head>


<body>

    <!-- Sign Up Page -->

    <main>


        <!-- Company Information -->

        <section>

            <h1>NEXORA</h1>

            <p>Smart Business Management</p>

        </section>

        <!-- Sign Up Form -->

        <section>

            <h2>Create Account</h2>

            <p>
                Create your NEXORA ERP account
            </p>


            <form id="signupForm">


                <!-- Full Name -->

                <div>

                    <label for="fullName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="fullName"
                        name="fullName"
                        placeholder="Enter your full name"
                        required
                    >

                </div>



                <!-- Email -->

                <div>

                    <label for="signupEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="signupEmail"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>



                <!-- Phone -->

                <div>

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter your phone number"
                        required
                    >

                </div>



                <!-- Password -->

                <div>

                    <label for="signupPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="signupPassword"
                        name="password"
                        placeholder="Create a password"
                        required
                    >

                </div>



                <!-- Confirm Password -->

                <div>

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >

                </div>



                <!-- Password Strength -->

                <div>

                    <p id="passwordStrength">
                        Password strength: -
                    </p>

                </div>



                <!-- Terms & Conditions -->

                <div>

                    <label>

                        <input
                            type="checkbox"
                            id="terms"
                            name="terms"
                            required
                        >

                        I agree to the Terms & Conditions

                    </label>

                </div>



                <!-- Create Account Button -->

                <button type="submit">

                    Create Account

                </button>



                <!-- Login Link -->

                <p>

                    Already have an account?

                    <a href="login.html">
                        Login
                    </a>

                </p>


            </form>

        </section>

    </main>


    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">




    <!-- JavaScript -->

    <script src="../js/main.js"></script>


</body>

</html>
