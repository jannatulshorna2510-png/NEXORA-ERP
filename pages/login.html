<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="NEXORA ERP Login">

    <title>NEXORA ERP - Login</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="login-page">

    <div class="login-wrapper">

        <!-- LOGIN CARD -->

        <div class="login-card">

            <!-- Logo -->

            <div class="login-logo">
                N
            </div>

            <div class="login-brand-name">
                NEXORA
            </div>

            <div class="login-brand-subtitle">
                ERP MANAGEMENT
            </div>


            <!-- Header -->

            <div class="login-header">

                <h2>
                    Welcome Back
                </h2>

                <p>
                    Sign in to your account
                </p>

            </div>


            <!-- ROLE -->

            <div class="login-label">
                ACCOUNT TYPE
            </div>

            <div class="role-selector">

                <button
                    type="button"
                    class="role-button active"
                    data-role="Admin">

                    <span class="role-icon">♛</span>

                    <span>
                        <strong>Admin</strong>
                        <small>Full Access</small>
                    </span>

                </button>


                <button
                    type="button"
                    class="role-button"
                    data-role="Manager">

                    <span class="role-icon">◆</span>

                    <span>
                        <strong>Manager</strong>
                        <small>Management</small>
                    </span>

                </button>


                <button
                    type="button"
                    class="role-button"
                    data-role="Employee">

                    <span class="role-icon">●</span>

                    <span>
                        <strong>Employee</strong>
                        <small>Basic Access</small>
                    </span>

                </button>

            </div>


            <!-- Selected Role -->

            <div class="selected-role-box">

                <span>
                    Logging in as
                </span>

                <strong id="selectedRole">
                    Admin
                </strong>

            </div>


            <!--  FORM  -->

            <form id="loginForm">

                <input
                    type="hidden"
                    id="selectedRoleInput"
                    value="Admin">


                <!-- Email -->

                <div class="login-form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">
                            @
                        </span>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required>

                    </div>

                </div>


                <!-- Password -->

                <div class="login-form-group">

                    <div class="password-label-row">

                        <label for="password">
                            Password
                        </label>

                        <a href="forgot-password.html">
                            Forgot Password?
                        </a>

                    </div>


                    <div class="input-wrapper">

                        <span class="input-icon">
                            *
                        </span>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required>

                        <button
                            type="button"
                            id="togglePassword"
                            class="password-toggle">

                            👁

                        </button>

                    </div>

                </div>


                <!-- Remember -->

                <div class="login-options">

                    <label class="remember-label">

                        <input
                            type="checkbox"
                            id="rememberMe">

                        <span>
                            Remember Me
                        </span>

                    </label>

                </div>


                <!-- Error -->

                <div
                    id="loginError"
                    class="login-message error-message">
                </div>


                <!-- Login Button -->

                <button
                    type="submit"
                    class="login-submit-button"
                    id="loginSubmitButton">

                    <span>
                        SIGN IN
                    </span>

                    <span class="login-arrow">
                        →
                    </span>

                </button>

            </form>


            <!--  SIGNUP  -->

            <div class="login-signup">

                <span>
                    Don't have an account?
                </span>

                <a href="signup.html">
                    Create Account
                </a>

            </div>


            <!-- Footer -->

            <div class="login-footer">
                © 2026 NEXORA Technologies
            </div>

        </div>

    </div>


    <script src="../js/main.js"></script>

</body>

</html>
