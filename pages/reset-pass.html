<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="NEXORA ERP Reset Password">

    <title>NEXORA ERP | Reset Password</title>

    <link rel="stylesheet" href="../css/style.css">

    <link rel="stylesheet" href="../css/responsive.css">

</head>


<body>

    <main>


        <!-- Company Information -->

        <section>

            <h1>NEXORA</h1>

            <p>Smart Business Management</p>

        </section>



        <!-- Reset Password -->

        <section>

            <h2>Reset Password</h2>

            <p>
                Create a new password for your account
            </p>


            <form id="resetPasswordForm">


                <!-- New Password -->

                <div>

                    <label for="newPassword">
                        New Password
                    </label>

                    <input
                        type="password"
                        id="newPassword"
                        placeholder="Enter new password"
                        required
                    >

                </div>



                <!-- Confirm Password -->

                <div>

                    <label for="resetConfirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="resetConfirmPassword"
                        placeholder="Confirm new password"
                        required
                    >

                </div>



                <!-- Reset Button -->

                <button type="submit">
                    Reset Password
                </button>



                <!-- Login -->

                <p>

                    <a href="login.html">
                        Back to Login
                    </a>

                </p>


            </form>

        </section>

    </main>


    <script src="../js/main.js"></script>

</body>

</html>
